name: Deploy Next.js to Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AZURE_WEBAPP_NAME: educy-platform
  NODE_VERSION: "24.x"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js
        run: npm run build

      - name: Prepare standalone
        run: |
          cp -r .next/static .next/standalone/.next/

          if [ -d public ]; then
            cp -r public .next/standalone/
          fi

      - name: Verify standalone build
        run: |
          echo "Standalone contents:"
          ls -la .next/standalone

          echo "Next build:"
          ls -la .next/standalone/.next

          echo "Checking server.js..."
          test -f .next/standalone/server.js

      - name: Create deployment ZIP
        run: |
          cd .next/standalone
          zip -r ../../nextjs-app.zip .

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-app
          path: nextjs-app.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download deployment ZIP
        uses: actions/download-artifact@v4
        with:
          name: nextjs-app
          path: .

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_6E89896FA7664359B1E2392DB69AEB7F }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_103BAC108D5847B58FDE8518DC7B613C }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_059F7D512D4241F8A86D3F6011F8549E }}

      - name: Deploy to Azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: educy-platform
          slot-name: Production
          package: nextjs-app.zip
          type: zip
          clean: true
          restart: true